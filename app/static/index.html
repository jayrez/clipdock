<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClipDock</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='8' r='6' fill='%23F2A83B'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0F1216; --panel:#151A21; --line:#242C36; --line-soft:#1B222B;
    --text:#E9EDF2; --muted:#8D98A5; --faint:#5C6672;
    --amber:#F2A83B; --amber-dim:rgba(242,168,59,.13); --red:#E5533C;
    --mono:"IBM Plex Mono",ui-monospace,monospace;
    --sans:"Space Grotesk",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{color-scheme:dark}
  body{
    background:var(--bg); color:var(--text); font-family:var(--sans);
    min-height:100vh; padding:48px 20px 80px;
    display:flex; justify-content:center;
    -webkit-font-smoothing:antialiased;
  }
  main{width:100%;max-width:600px}

  a{color:inherit}
  :focus{outline:none}
  :focus-visible{outline:2px solid var(--amber);outline-offset:2px;border-radius:4px}

  /* ---------- header ---------- */
  header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:44px}
  .wordmark{font-weight:600;font-size:17px;letter-spacing:.02em;display:flex;align-items:center;gap:8px}
  .tally{width:8px;height:8px;border-radius:50%;background:var(--amber);box-shadow:0 0 10px rgba(242,168,59,.6)}
  .tagline{font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:.04em}

  /* ---------- auth ---------- */
  #authRow{display:none;align-items:center;gap:10px;margin-bottom:28px;
    border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:var(--panel)}
  #authRow.show{display:flex}
  #authRow label{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap;letter-spacing:.05em}
  #authRow input{flex:1;background:none;border:none;color:var(--text);
    font-family:var(--mono);font-size:13px}

  /* ---------- form ---------- */
  .field-label{font-family:var(--mono);font-size:11px;letter-spacing:.09em;
    color:var(--muted);text-transform:uppercase;margin-bottom:8px;display:block}
  #url{
    width:100%;background:var(--panel);border:1px solid var(--line);border-radius:12px;
    color:var(--text);font-family:var(--sans);font-size:15px;padding:15px 16px;
    transition:border-color .15s;
  }
  #url::placeholder{color:var(--faint)}
  #url:focus{border-color:var(--amber)}

  /* preview */
  #preview{display:none;margin-top:12px;gap:14px;align-items:center;
    border:1px solid var(--line-soft);border-radius:12px;padding:10px;background:var(--panel)}
  #preview.show{display:flex}
  #preview img{width:104px;aspect-ratio:16/9;object-fit:cover;border-radius:8px;background:#000;flex:none}
  #pvTitle{font-size:14px;font-weight:500;line-height:1.35;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  #pvMeta{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:5px}

  /* segmented controls */
  .seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;width:max-content}
  .seg button{
    background:none;border:none;color:var(--muted);font-family:var(--sans);
    font-size:13px;font-weight:500;padding:9px 16px;cursor:pointer;
    border-right:1px solid var(--line);transition:color .12s,background .12s;
  }
  .seg button:last-child{border-right:none}
  .seg button[aria-pressed="true"]{background:var(--amber-dim);color:var(--amber)}
  .row{display:flex;gap:32px;flex-wrap:wrap;margin-top:28px}

  /* ---------- timecode deck (signature) ---------- */
  #deck{display:none;margin-top:22px}
  #deck.show{display:block}
  .deck-inner{
    display:flex;align-items:stretch;border:1px solid var(--line);
    border-radius:14px;background:var(--panel);overflow:hidden;
  }
  .tc{flex:1;padding:14px 18px 16px}
  .tc + .tc-mid{border-left:1px solid var(--line-soft)}
  .tc-mid{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:0 18px;border-right:1px solid var(--line-soft);gap:6px}
  .tc label{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--faint);display:block;margin-bottom:6px}
  .tc input{
    width:100%;background:none;border:none;color:var(--amber);
    font-family:var(--mono);font-size:26px;font-weight:500;letter-spacing:.06em;
    text-shadow:0 0 14px rgba(242,168,59,.35);
  }
  .tc input::placeholder{color:#4A4235;text-shadow:none}
  .tc input.invalid{color:var(--red);text-shadow:0 0 14px rgba(229,83,60,.35)}
  #durChip{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
  .tc-mid .arrow{color:var(--faint);font-size:13px}
  .deck-hint{font-family:var(--mono);font-size:11px;color:var(--faint);margin-top:8px}

  /* ---------- action ---------- */
  #go{
    margin-top:32px;width:100%;padding:15px;border:none;border-radius:12px;cursor:pointer;
    background:var(--amber);color:#191104;font-family:var(--sans);font-size:15px;font-weight:600;
    letter-spacing:.01em;transition:filter .12s,opacity .12s;
  }
  #go:hover{filter:brightness(1.07)}
  #go:disabled{opacity:.45;cursor:default;filter:none}

  /* ---------- progress ---------- */
  #job{display:none;margin-top:20px}
  #job.show{display:block}
  .bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden}
  .bar i{display:block;height:100%;width:0%;background:var(--amber);border-radius:2px;
    transition:width .4s ease}
  @media (prefers-reduced-motion:reduce){.bar i{transition:none}}
  #jobMeta{display:flex;justify-content:space-between;margin-top:8px;
    font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.05em}
  #jobErr{display:none;margin-top:10px;font-family:var(--mono);font-size:12px;
    color:var(--red);white-space:pre-wrap;line-height:1.5}

  /* ---------- library ---------- */
  #library{margin-top:56px}
  #library h2{font-size:13px;font-weight:500;color:var(--muted);letter-spacing:.09em;
    text-transform:uppercase;font-family:var(--mono);margin-bottom:14px}
  .file{display:flex;align-items:center;gap:12px;padding:12px 4px;
    border-bottom:1px solid var(--line-soft)}
  .file:first-of-type{border-top:1px solid var(--line-soft)}
  .file .name{flex:1;font-family:var(--mono);font-size:12.5px;line-height:1.4;
    overflow-wrap:anywhere}
  .file .size{font-family:var(--mono);font-size:11px;color:var(--faint);flex:none}
  .file a,.file button{
    flex:none;display:grid;place-items:center;width:32px;height:32px;border-radius:8px;
    border:1px solid var(--line);background:none;color:var(--muted);cursor:pointer;
    transition:color .12s,border-color .12s;text-decoration:none;
  }
  .file a:hover{color:var(--amber);border-color:var(--amber)}
  .file button:hover{color:var(--red);border-color:var(--red)}
  .file.fresh .name{color:var(--amber)}
  #empty{font-size:13.5px;color:var(--faint);padding:6px 4px}

  footer{margin-top:64px;font-family:var(--mono);font-size:10.5px;color:#3E4750;
    letter-spacing:.05em}
</style>
</head>
<body>
<main>
  <header>
    <div class="wordmark"><span class="tally" aria-hidden="true"></span>clipdock</div>
    <div class="tagline">url&nbsp;→&nbsp;mp4</div>
  </header>

  <div id="authRow">
    <label for="pw">ACCESS&nbsp;KEY</label>
    <input id="pw" type="password" autocomplete="current-password" placeholder="••••••••">
  </div>

  <label class="field-label" for="url">Video URL</label>
  <input id="url" type="url" inputmode="url" spellcheck="false" autocomplete="off"
         placeholder="https://www.youtube.com/watch?v=…">

  <div id="preview">
    <img id="pvThumb" alt="">
    <div>
      <div id="pvTitle"></div>
      <div id="pvMeta"></div>
    </div>
  </div>

  <div class="row">
    <div>
      <span class="field-label">Range</span>
      <div class="seg" role="group" aria-label="Download range">
        <button id="modeFull" aria-pressed="true">Full video</button>
        <button id="modeClip" aria-pressed="false">Clip a section</button>
      </div>
    </div>
    <div>
      <span class="field-label">Quality</span>
      <div class="seg" id="quality" role="group" aria-label="Quality">
        <button data-q="best" aria-pressed="true">Best</button>
        <button data-q="1080" aria-pressed="false">1080p</button>
        <button data-q="720" aria-pressed="false">720p</button>
        <button data-q="480" aria-pressed="false">480p</button>
      </div>
    </div>
  </div>

  <div id="deck">
    <div class="deck-inner">
      <div class="tc">
        <label for="tcIn">IN</label>
        <input id="tcIn" placeholder="00:00" spellcheck="false" autocomplete="off">
      </div>
      <div class="tc-mid">
        <span class="arrow" aria-hidden="true">→</span>
        <span id="durChip">— s</span>
      </div>
      <div class="tc">
        <label for="tcOut">OUT</label>
        <input id="tcOut" placeholder="00:10" spellcheck="false" autocomplete="off">
      </div>
    </div>
    <p class="deck-hint">MM:SS or HH:MM:SS · cuts are keyframe-accurate</p>
  </div>

  <button id="go">Download MP4</button>

  <div id="job">
    <div class="bar"><i id="barFill"></i></div>
    <div id="jobMeta"><span id="jobStage">queued</span><span id="jobPct">0%</span></div>
    <div id="jobErr"></div>
  </div>

  <section id="library">
    <h2>Library</h2>
    <div id="files"></div>
    <p id="empty">Clips you download will appear here.</p>
  </section>

  <footer>self-hosted · yt-dlp + ffmpeg</footer>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);
  let appKey = "";            // held in memory only
  let mode = "full";
  let quality = "best";
  let probeTimer = null;
  let pollTimer = null;
  let videoDuration = null;

  const headers = () => appKey
    ? {"Content-Type":"application/json","X-App-Password":appKey}
    : {"Content-Type":"application/json"};

  const api = async (path, opts={}) => {
    const res = await fetch(path, {headers: headers(), ...opts,
      headers: {...headers(), ...(opts.headers||{})}});
    if (!res.ok) {
      let msg = res.statusText;
      try { msg = (await res.json()).detail || msg; } catch {}
      throw new Error(msg);
    }
    return res.json();
  };

  /* ---------- timecode helpers ---------- */
  const parseTC = s => {
    s = s.trim();
    if (!s) return null;
    if (!/^(\d{1,3}:)?(\d{1,2}:)?\d{1,2}(\.\d{1,3})?$/.test(s)) return NaN;
    return s.split(":").reduce((a,p)=>a*60+parseFloat(p),0);
  };
  const fmtDur = s => {
    if (s == null || isNaN(s)) return "—";
    s = Math.round(s);
    if (s < 60) return s + " s";
    const m = Math.floor(s/60), r = s%60;
    if (m < 60) return `${m}:${String(r).padStart(2,"0")}`;
    return `${Math.floor(m/60)}:${String(m%60).padStart(2,"0")}:${String(r).padStart(2,"0")}`;
  };
  const fmtSize = b => b > 1048576*900 ? (b/1073741824).toFixed(2)+" GB"
                     : b > 1048576 ? (b/1048576).toFixed(1)+" MB"
                     : Math.max(1,Math.round(b/1024))+" KB";

  const refreshDur = () => {
    const a = parseTC($("tcIn").value), b = parseTC($("tcOut").value);
    $("tcIn").classList.toggle("invalid", Number.isNaN(a));
    $("tcOut").classList.toggle("invalid",
      Number.isNaN(b) || (a!=null && b!=null && !isNaN(a) && !isNaN(b) && b<=a));
    $("durChip").textContent =
      (a!=null && b!=null && !isNaN(a) && !isNaN(b) && b>a) ? fmtDur(b-a) : "— s";
  };
  $("tcIn").addEventListener("input", refreshDur);
  $("tcOut").addEventListener("input", refreshDur);

  /* ---------- mode + quality ---------- */
  const setMode = m => {
    mode = m;
    $("modeFull").setAttribute("aria-pressed", m==="full");
    $("modeClip").setAttribute("aria-pressed", m==="clip");
    $("deck").classList.toggle("show", m==="clip");
    if (m==="clip" && !$("tcIn").value) $("tcIn").value = "00:00";
    refreshDur();
  };
  $("modeFull").onclick = () => setMode("full");
  $("modeClip").onclick = () => setMode("clip");

  $("quality").addEventListener("click", e => {
    const b = e.target.closest("button[data-q]");
    if (!b) return;
    quality = b.dataset.q;
    for (const x of $("quality").children)
      x.setAttribute("aria-pressed", x === b);
  });

  /* ---------- probe ---------- */
  const probe = async () => {
    const url = $("url").value.trim();
    if (!/^https?:\/\//.test(url)) { $("preview").classList.remove("show"); return; }
    try {
      const info = await api("/api/probe",
        {method:"POST", body: JSON.stringify({url})});
      $("pvThumb").src = info.thumbnail || "";
      $("pvTitle").textContent = info.title || url;
      videoDuration = info.duration ?? null;
      $("pvMeta").textContent = [info.uploader, fmtDur(info.duration)]
        .filter(Boolean).join(" · ");
      $("preview").classList.add("show");
    } catch (e) {
      $("preview").classList.remove("show");
    }
  };
  $("url").addEventListener("input", () => {
    clearTimeout(probeTimer);
    probeTimer = setTimeout(probe, 700);
  });

  /* ---------- job ---------- */
  const setStage = (stage, pct) => {
    $("jobStage").textContent = stage;
    $("jobPct").textContent = Math.round(pct) + "%";
    $("barFill").style.width = pct + "%";
  };

  $("go").onclick = async () => {
    const url = $("url").value.trim();
    if (!/^https?:\/\//.test(url)) { $("url").focus(); return; }

    const body = {url, quality};
    if (mode === "clip") {
      const a = parseTC($("tcIn").value), b = parseTC($("tcOut").value);
      if (a==null || b==null || isNaN(a) || isNaN(b) || b<=a) { refreshDur(); return; }
      if (videoDuration && b > videoDuration + 1) { refreshDur(); }
      body.start = $("tcIn").value.trim();
      body.end = $("tcOut").value.trim();
    }

    $("go").disabled = true;
    $("job").classList.add("show");
    $("jobErr").style.display = "none";
    $("jobErr").textContent = "";
    $("barFill").style.background = "var(--amber)";
    setStage("queued", 0);

    try {
      const {id} = await api("/api/jobs", {method:"POST", body: JSON.stringify(body)});
      pollTimer = setInterval(async () => {
        try {
          const j = await api("/api/jobs/" + id);
          if (j.status === "error") {
            clearInterval(pollTimer);
            $("go").disabled = false;
            setStage("failed", 0);
            $("barFill").style.background = "var(--red)";
            $("jobErr").textContent = j.error || "Download failed.";
            $("jobErr").style.display = "block";
            return;
          }
          setStage(j.status, j.progress || 0);
          if (j.status === "done") {
            clearInterval(pollTimer);
            $("go").disabled = false;
            setStage("done", 100);
            await loadFiles(j.filename);
          }
        } catch { /* transient poll error — keep polling */ }
      }, 800);
    } catch (e) {
      $("go").disabled = false;
      setStage("failed", 0);
      $("jobErr").textContent = e.message;
      $("jobErr").style.display = "block";
    }
  };

  /* ---------- library ---------- */
  const loadFiles = async (highlight) => {
    let data;
    try { data = await api("/api/files"); } catch { return; }
    const box = $("files");
    box.innerHTML = "";
    $("empty").style.display = data.files.length ? "none" : "block";
    for (const f of data.files) {
      const row = document.createElement("div");
      row.className = "file" + (f.name === highlight ? " fresh" : "");
      const dl = "/api/files/" + encodeURIComponent(f.name)
               + (appKey ? "?key=" + encodeURIComponent(appKey) : "");
      row.innerHTML = `
        <span class="name"></span>
        <span class="size">${fmtSize(f.size)}</span>
        <a href="${dl}" download title="Download" aria-label="Download ${f.name}">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M12 3v12m0 0l-5-5m5 5l5-5M4 21h16"/></svg></a>
        <button title="Delete" aria-label="Delete ${f.name}">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M6 6l12 12M18 6L6 18"/></svg></button>`;
      row.querySelector(".name").textContent = f.name;
      row.querySelector("button").onclick = async () => {
        try {
          await api("/api/files/" + encodeURIComponent(f.name), {method:"DELETE"});
          loadFiles();
        } catch {}
      };
      box.appendChild(row);
    }
  };

  /* ---------- init ---------- */
  (async () => {
    try {
      const cfg = await (await fetch("/api/config")).json();
      if (cfg.auth_required) {
        $("authRow").classList.add("show");
        $("pw").addEventListener("change", () => {
          appKey = $("pw").value;
          loadFiles();
        });
      }
    } catch {}
    loadFiles();
  })();
})();
</script>
</body>
</html>
